apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/musaumakau/k8s-observability-stack.git
    targetRevision: main
    path: apps
    directory:
      recurse: true
      exclude: '{kustomization.yaml,*-values.yaml,alloy-values.yaml}'
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
